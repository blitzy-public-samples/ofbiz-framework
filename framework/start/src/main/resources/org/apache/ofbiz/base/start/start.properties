####################################
# OFBiz Startup Application Settings
####################################

# --- OFBiz startup loaders comma separated
ofbiz.start.loaders=main

# --- OFBiz home directory. Default is current directory
#ofbiz.home=

# --- logs directory relative to ofbiz.home. Default is runtime/logs
#ofbiz.log.dir=

# --- Container config file relative to ofbiz.home.
#     Default is framework/base/config/ofbiz-containers.xml
#ofbiz.container.config=

# --- Network host, port and key used by the AdminClient to communicate
#     with AdminServer for shutting down OFBiz or inquiring on status
#     Default ofbiz.admin.host 127.0.0.1
#     Default ofbiz.admin.port 0
#     Default ofbiz.admin.key NA
# -- ofbiz.admin.key is a SECRET and is deliberately shipped WITHOUT a value, so that no
#     credential resides in the source tree or in the container image; the key is
#     supplied at deploy time only.
#     The property is left COMMENTED OUT rather than blank on purpose: Config.java
#     resolves it with props.getProperty("ofbiz.admin.key", "NA"), which returns the
#     "NA" default only while the key is ABSENT. A blank assignment would instead
#     yield the empty string, and AdminServerContainer compares the key with
#     String.equals, so "ofbiz --shutdown" and "ofbiz --status" would silently fail.
# -- Never store a value or a placeholder expression on this line. Config.java loads
#     this file with plain java.util.Properties and OFBiz performs NO environment
#     variable expansion on this path, so ${OFBIZ_ADMIN_KEY}, ${env:...} or @TOKEN@
#     would be taken verbatim as the key and would break that comparison.
# -- Choosing a value: it must not contain ":". AdminServerContainer reads a request as
#     key:command and compares everything before the FIRST ":" with this property, so a
#     key that contains one can never match and would make a clean shutdown impossible.
#     docker/docker-entrypoint.sh refuses such a value rather than injecting it.
# -- Supplying the key at deploy time. OFBIZ_ADMIN_KEY is the environment variable
#     reserved for it and docker/docker-entrypoint.sh injects it at container start.
#     Two mechanisms exist. Use (1); (2) is documented only so that its exposure is
#     understood, and must not be used for a deployment.
#     (1) RECOMMENDED -- a PROTECTED PROPERTY OVERRIDE FILE. This resource is read
#         PACKAGE QUALIFIED as org/apache/ofbiz/base/start/start.properties, so an
#         override must keep that path under config/, i.e.
#         config/org/apache/ofbiz/base/start/start.properties. The generated start script
#         resolves it ahead of the packaged copy because build.gradle rewrites the
#         launcher CLASSPATH as config/:lib-extra/*:lib (see tasks.startScripts). A FLAT
#         config/start.properties does NOT shadow it, unlike config/security.properties
#         or config/url.properties. docker-entrypoint.sh writes exactly that file from
#         the pristine shipped copy on every start, atomically, with mode 0600 and with
#         the value escaped for the java.util.Properties grammar, so the key is readable
#         only by the account OFBiz runs as and a rotated key takes effect on a restart.
#         Editing the copy under framework/ that a PACKAGED DISTRIBUTION ships does NOT
#         change what the JVM reads, because that copy is not on the launcher classpath;
#         in a source checkout, where the resource is rebuilt from this file, it does
#         take effect after a rebuild but leaves the secret in a world readable file.
#         Confirm any override with "ofbiz --status": a mismatch is reported as a
#         rejected request, not as a startup error.
#     (2) NOT RECOMMENDED -- a JVM SYSTEM PROPERTY. Config.getProperty() consults
#         System.getProperty() BEFORE this file, so -Dofbiz.admin.key="$OFBIZ_ADMIN_KEY"
#         does override it with no file rewriting at all. It is nevertheless UNSAFE: a
#         command line argument is visible in the process table and in
#         /proc/<pid>/cmdline to every process in the namespace, is captured in crash and
#         diagnostic dumps, and cannot be withdrawn once observed. The same objection
#         applies to carrying the key in JAVA_OPTS, in OFBIZ_OPTS or in a Gradle
#         -PjvmArgs value, all three of which the start script and Gradle tasks honour.
#     Note that --load-data reads load-data.properties and --test reads test.properties,
#     so neither of those two startup profiles consults this file at all.
# -- Deployment profile. OFBIZ_PROFILE selects the enforcement level and defaults to
#     dev. In prod the entry point REFUSES TO START when OFBIZ_ADMIN_KEY is absent, and
#     it also rejects a value that is blank, is the published "NA" default, is shorter
#     than 16 characters, uses fewer than 8 distinct characters, contains a control
#     character, or contains ":". A value drawn at random passes the distinct character
#     floor with overwhelming probability, so only hand typed placeholders are refused.
#     In dev the entry point generates a random per-container key instead and keeps it
#     under runtime/container_state/generated_secrets, so it stays stable across
#     restarts and no deployment ever runs on the publicly known "NA" value. A plain
#     source checkout started with "gradlew ofbiz" has no entry point, so this file
#     stays exactly as shipped and Config.java applies its "NA" default; "ofbiz
#     --status" and "ofbiz --shutdown" build Config the same way, so client and server
#     agree and local development still needs no configuration at all.
#     The sibling secrets live in framework/security/config/security.properties and are
#     fed by OFBIZ_LOGIN_SECRET_KEY (login.secret_key_string) and OFBIZ_JWT_TOKEN_KEY
#     (security.token.key); do not redeclare either of them here. The entry point unsets
#     all three before it execs OFBiz, so none of them is exposed in the application
#     process environment or through /proc/<pid>/environ.
# -- Shutdown parity. docker/send_ofbiz_stop_signal.sh, which docker-entrypoint.sh calls
#     from its SIGTERM/SIGINT trap, resolves the key with the SAME precedence as
#     Config.java: $OFBIZ_ADMIN_KEY from the environment first, then an ACTIVE
#     ofbiz.admin.key= assignment in the package qualified override or in this file,
#     then "NA". AdminServerContainer compares the presented key with the configured one
#     using String.equals, so any divergence would leave the container unable to shut
#     down cleanly. A commented-out line is correctly read as "not declared", so an
#     unconfigured checkout shuts down on the shared "NA" default instead of on an empty
#     key that AdminServerContainer would reject. That script masks the key -- it reports
#     only where the value came from -- and it disables xtrace before it reads this file
#     at all, because it expands the whole file content as a command argument; every
#     secret-handling region of the entry point suspends tracing the same way. The
#     ofbiz.admin.port assignment below deliberately stays ACTIVE for it: the port is not
#     a secret, and both AdminServerContainer and the shutdown helper need it.
#ofbiz.admin.host=
ofbiz.admin.port=10523
#ofbiz.admin.key=

# -- Enable the JVM shutdown hook. Default is true
#ofbiz.enable.hook=false

# -- Auto-Shutdown after load. Default is false
#ofbiz.auto.shutdown=true

# --- Tells AWT to not require a head (X11). Default is true
#java.awt.headless=false

# -- DEPRECATED
# -- ofbiz.locale.default was used in old days where you had to set the user.language system property manually from CLI when launching OFBiz to set the default language.
# -- This is no longer true for a while. The language used by default is taken from the browser*:
# -- This is done by UtilHttp::getLocale which ultimately uses:
# --    Locale jakarta.servlet.ServletRequest.getLocale()
# --    Returns the preferred Locale that the client will accept content in, based on the Accept-Language header.
# --    If the client request doesn't provide an Accept-Language header, this method returns the default locale for the server.
# --    Returns: the preferred Locale for the client
# -- We also use initialLocaleComplete in the screens for JavaScript part.
# -- It though may be still used by jobs pending that run before any UI interactions.
#ofbiz.locale.default=en_US

# -- The time zone for this OFBiz instance. Default depends on JVM environment
#ofbiz.timeZone.default=GMT
