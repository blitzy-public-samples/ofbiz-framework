####################################
# OFBiz Startup Application Settings
####################################

# --- OFBiz startup loaders comma separated
ofbiz.start.loaders=main

# --- OFBiz home directory. Default is current directory
#ofbiz.home=

# --- logs directory relative to ofbiz.home. Default is runtime/logs
#ofbiz.log.dir=

# --- Container config file relative to ofbiz.home.
#     Default is framework/base/config/ofbiz-containers.xml
#ofbiz.container.config=

# --- Network host, port and key used by the AdminClient to communicate
#     with AdminServer for shutting down OFBiz or inquiring on status
#     Default ofbiz.admin.host 127.0.0.1
#     Default ofbiz.admin.port 0
#     Default ofbiz.admin.key NA
# -- ofbiz.admin.key is a SECRET and this packaged property carries NO value: the key is
#     supplied at run time, from the environment, into the override described below.
#     The property is left COMMENTED OUT rather than blank on purpose: Config.java
#     resolves it with props.getProperty("ofbiz.admin.key", "NA"), which returns the
#     "NA" default only while the key is ABSENT. A blank assignment would instead
#     yield the empty string, and AdminServerContainer compares the key with
#     String.equals, so "ofbiz --shutdown" and "ofbiz --status" would silently fail.
# -- Never store a value or a placeholder expression on this line. This file is read
#     with plain java.util.Properties and no environment variable expansion is
#     performed on it, so ${OFBIZ_ADMIN_KEY} or an at-sign delimited token would be
#     taken verbatim as the key and would break that comparison.
# -- A key must not contain ":". AdminServerContainer reads a request as key:command
#     and compares everything before the FIRST ":" with this property, so a key that
#     contains one can never match and would make a clean shutdown impossible.
# -- OFBIZ_ADMIN_KEY is the environment variable reserved for the value.
#     docker/docker-entrypoint.sh writes it at container start into the package qualified
#     override config/org/apache/ofbiz/base/start/start.properties, which the launcher
#     classpath resolves ahead of this packaged copy. THIS FILE IS NEVER WRITTEN TO: the
#     override is also where docker/send_ofbiz_stop_signal.sh finds the key it needs to
#     authenticate the shutdown request the container's SIGTERM handler sends, because it
#     searches the same two paths in the same precedence order. With OFBIZ_PROFILE=prod a
#     missing key is fatal; with OFBIZ_PROFILE=dev and no key supplied, the entry point
#     generates a random per-container key into that override so that a clean shutdown still
#     works. See DOCKER.adoc.
#ofbiz.admin.host=
ofbiz.admin.port=10523
#ofbiz.admin.key=

# -- Enable the JVM shutdown hook. Default is true
#ofbiz.enable.hook=false

# -- Auto-Shutdown after load. Default is false
#ofbiz.auto.shutdown=true

# --- Tells AWT to not require a head (X11). Default is true
#java.awt.headless=false

# -- DEPRECATED
# -- ofbiz.locale.default was used in old days where you had to set the user.language system property manually from CLI when launching OFBiz to set the default language.
# -- This is no longer true for a while. The language used by default is taken from the browser*:
# -- This is done by UtilHttp::getLocale which ultimately uses:
# --    Locale jakarta.servlet.ServletRequest.getLocale()
# --    Returns the preferred Locale that the client will accept content in, based on the Accept-Language header.
# --    If the client request doesn't provide an Accept-Language header, this method returns the default locale for the server.
# --    Returns: the preferred Locale for the client
# -- We also use initialLocaleComplete in the screens for JavaScript part.
# -- It though may be still used by jobs pending that run before any UI interactions.
#ofbiz.locale.default=en_US

# -- The time zone for this OFBiz instance. Default depends on JVM environment
#ofbiz.timeZone.default=GMT
