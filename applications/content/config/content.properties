owner.content.id=CONTENT_ROOT
img.request=/content/control/img/
img.request.param.name=imgId

stream.permission.service=genericContentPermission
stream.buffersize=8192

baseUrl=https://localhost:8443
disable.ftl.template.cache=true
permissionRecorderOn=true
allowedHasRoleOperations=HAS_USER_ROLE|HAS_AUTHOR_ROLE|HAS_EDITOR_ROLE|HAS_ADMIN_ROLE|HAS_PUBLISHER_ROLE
viewSize=10

# user level content uploading (relative to ofbiz.home)
content.upload.path.prefix=runtime/uploads
content.upload.max.files=250
content.upload.always.local.file=true

# content output folder (relative to ofbiz.home)
content.output.path=runtime/output

# default mime type used in *ContentWrapper classes
defaultMimeType=text/html; charset=utf-8


# content storage backend
#
# Every value below is committed blank, or database/false, so that an unmodified checkout stores
# content exactly where it always has and so that no credential lives in the repository or in the
# container image. In a container deployment docker-entrypoint.sh supplies all seven of these keys
# from the environment and renders this resource into config/content.properties, which precedes
# ofbiz.jar on the class path; editing that rendered copy has no lasting effect because the render
# is redone from this file on every start. Set the environment variables instead.
#
# Maintenance rule: the seven content.store.* declarations that carry an "<- OFBIZ_" marker below,
# and content.store.s3.insecure.endpoint.allowed which the entry point derives from OFBIZ_PROFILE,
# are the anchors that docker/docker-entrypoint.sh substitutes, paired index by index with its
# CONTENT_STORE_VARIABLES array. Each is matched as "^<name>=" at the start of a line, so the name,
# the "=" and the position at column one must be preserved. The remaining declarations are bounds
# and deadlines that carry no environment variable: they have committed defaults every deployment
# can run on, they are read from whichever copy of this resource is on the class path, and a
# SystemProperty row overrides any of them without a restart.
#
# WHICH SETTINGS A SystemProperty ROW MAY OVERRIDE. Only those bounds and deadlines, plus the key
# prefix. The eight settings the entry point renders decide WHERE durable content is written and
# WHICH principal writes it, so they are read from this resource alone: a database row able to change
# them would be a second control plane over the deployment's storage location and identity, one that
# the container's own validation never sees and that cannot change all of them at once.

# selects the storage backend for DataResource content and uploads   <- OFBIZ_CONTENT_STORE_PROVIDER
# database (the default) keeps the existing DataResource database storage; filesystem uses the
# content.upload.path.prefix tree above; s3 uses the content.store.s3.* settings below.
# The value is trimmed and compared case-insensitively. Leaving it unset or blank means database.
# A value that is present but is none of the three is REFUSED rather than defaulted: a deployment
# that asked for s3 and mistyped it would otherwise start and write its durable content to a
# different backend from the one named here, which no later restart can put right.
content.store.provider=database

# s3 provider

# target bucket; required by the s3 provider                         <- OFBIZ_S3_BUCKET
content.store.s3.bucket=
# region identifier; required by the s3 provider                     <- OFBIZ_S3_REGION
content.store.s3.region=
# endpoint override url; blank means Amazon S3, otherwise the        <- OFBIZ_S3_ENDPOINT
# S3-compatible store at that endpoint. A cloud instance metadata address is refused in every
# configuration, and a plaintext http endpoint is refused unless it names this host or is permitted
# by content.store.s3.insecure.endpoint.allowed below, because the provider sends this deployment's
# credentials to whatever it is told is the object store.
content.store.s3.endpoint=
# object store credentials; both are blank here so that no credential is committed
# <- OFBIZ_S3_ACCESS_KEY_ID and OFBIZ_S3_SECRET_ACCESS_KEY. Supply both to authenticate with them
# directly, or neither to defer to the AWS default credential chain (instance role, container
# credentials, shared profile, environment); one without the other is refused.
content.store.s3.access.key.id=
content.store.s3.secret.access.key=
# path-style addressing; true|false, default false                   <- OFBIZ_S3_PATH_STYLE
# usually true for S3-compatible stores that do not support virtual-host-style addressing.
# A value that is neither true nor false is refused rather than read as false, because this decides
# the shape of every request url and most S3-compatible stores serve nothing without it.
content.store.s3.path.style=false

# permits a plaintext http endpoint to a host other than this one;   <- derived from OFBIZ_PROFILE
# true|false, committed false. An http endpoint sends this deployment's credentials, and the content
# it returns, over an unencrypted connection, so it is refused unless the endpoint names this host -
# where the traffic never reaches a network - or this setting says the deployment accepts it. A
# container renders it from OFBIZ_PROFILE: true only for a development profile that supplied an
# http:// endpoint, and never in the deployed profile, which refuses such an endpoint outright before
# the JVM starts. Set it by hand only for a development store; there is no reason to set it in a
# deployment that can use https.
content.store.s3.insecure.endpoint.allowed=false

# key prefix inside the bucket; blank means the keys start at the root of the bucket. Set it to
# share one bucket between deployments: every key this provider reads or writes is placed under it,
# and a key that would reach outside it is refused. A leading or trailing "/" is not needed and is
# ignored. Object-store keys are already scoped by tenant and by DataResource id below that prefix,
# so this exists to separate deployments, not to separate tenants.
content.store.s3.key.prefix=

# bounds
#
# The two settings below are what keep one request from consuming an instance. They apply to every
# provider, not only to s3, and they are read on each use so a SystemProperty row changes them
# without a restart. A value that is not a number, or is outside the accepted range, is reported
# once in the log and the default below applies - a bound that silently became "unbounded" would
# be worse than no bound at all.

# largest content, in bytes, that one WHOLE-OBJECT read may hold in memory at once; default 10485760
# (10 MiB). Accepted range 1024..2147483639, the largest array a JVM can allocate. Content above the
# bound is refused before it is allocated, and what is read is bounded as it is read, so a store that
# understates a size cannot defeat the check.
#
# It applies to a whole read - the operation a caller uses when it needs the content as an array, and
# how content is served to a consumer that needs its length up front - and never to an opened stream,
# which is how content is rendered into a screen or a template and is never held in memory in full.
# That distinction is the point of having two read operations. It also bounds what one upload may
# publish to an object store, on purpose and by the same number: content the store would hold but no
# consumer could then be served in one piece would only look published, so an upload larger than this
# is refused rather than half stored. Raise it in a deployment that stores content this large; raising
# it is not how a deployment serves large files, only how it raises the ceiling on the callers that
# genuinely need a length up front.
content.store.max.object.size=10485760

# whether a store miss may be answered from the content this instance holds locally; true|false,
# default true. The store is always the authority where it holds content, so this decides only what
# a store MISS means for a resource this instance happens to hold a file for. True is the committed
# default because selecting a provider must not stop a deployment serving content it served the day
# before: the shipped demo content and every file uploaded before the provider was switched on are
# not in the store yet. Content written from then on needs no bridge, because an upload is published
# to the store as it is written. Set it false once existing content has been copied into the store:
# that is the strict posture in which content the store does not hold is an error rather than a file
# only one fleet member can see, and selecting an object store while it is false logs a warning
# naming what will be refused. Leaving it enabled after the migration window hides a store that
# cannot be read from, which is the cost of the bridge. A value that is neither true nor false is
# reported once and this committed default applies.
content.store.local.fallback=true

# s3 deadlines and retries
#
# There are THREE deadlines rather than one because an object store can fail in three different ways,
# and the first two do not cover the third. The SDK's api-call and attempt deadlines bound the CALL -
# the request, the response headers and the retries - and they stop the moment the SDK hands back the
# response stream, because from then on the SDK is doing nothing and the body arrives as it is read.
# What bounds the body after that, in the SDK alone, is the socket read timeout, and that is an
# INACTIVITY bound: a store that sends one byte just inside every socket timeout holds a request
# thread, a connection and a pool slot for as long as it likes: a deployment whose store can behave
# that way must bound it at the network - a load balancer or proxy idle/total timeout in front of the
# store - because the provider does not. Each value is validated the same way as the bounds above; a
# value outside its range is reported once and the default applies.

# deadline for one whole storage call, retries included, in milliseconds; default 30000.
# Accepted range 1000..600000. This covers the request and the response headers, NOT the body.
content.store.s3.api.timeout.millis=30000

# deadline for a single attempt within that call, in milliseconds; default 10000. Accepted range
# 500..600000, and a value above the whole-call deadline is reported and the default applies,
# because an attempt that outlives its call can never complete.
content.store.s3.attempt.timeout.millis=10000


# retries after a failed first attempt; default 3, accepted range 0..10. 0 means one attempt and no
# retry. The cap is applied to the SDK's STANDARD retry strategy, which the provider names explicitly
# rather than inheriting: what the SDK selects when nothing says otherwise is decided by RetryMode,
# whose default in this SDK line is the legacy strategy, so a deployment that relied on "standard
# applies by default" would have been getting different backoff and no retry-capacity throttle. The
# standard strategy's own retry-capacity throttle is what stops a failing store from being retried by
# every request at once, so an outage costs a bounded number of attempts per request rather than the
# full cap on every one of them.
content.store.s3.max.retries=3

