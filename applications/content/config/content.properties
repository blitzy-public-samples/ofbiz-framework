owner.content.id=CONTENT_ROOT
img.request=/content/control/img/
img.request.param.name=imgId

stream.permission.service=genericContentPermission
stream.buffersize=8192

baseUrl=https://localhost:8443
disable.ftl.template.cache=true
permissionRecorderOn=true
allowedHasRoleOperations=HAS_USER_ROLE|HAS_AUTHOR_ROLE|HAS_EDITOR_ROLE|HAS_ADMIN_ROLE|HAS_PUBLISHER_ROLE
viewSize=10

# user level content uploading (relative to ofbiz.home)
content.upload.path.prefix=runtime/uploads
content.upload.max.files=250
content.upload.always.local.file=true

# content output folder (relative to ofbiz.home)
content.output.path=runtime/output

# default mime type used in *ContentWrapper classes
defaultMimeType=text/html; charset=utf-8

# content storage backend
#
# Every value below is committed blank, or database/false, so that an unmodified checkout stores content
# exactly where it always has and no credential lives in the repository or in the container image.
#
# In a container deployment eleven of these keys are supplied from the environment: docker-entrypoint.sh
# renders the whole of this resource into /ofbiz/config/content.properties, which precedes ofbiz.jar on
# the class path, with mode 0600, and then removes the variables from the environment the OFBiz process
# inherits. The variable that supplies each key is named against it below. Editing the copy in a running
# container therefore has no lasting effect - the render is redone from this file on every start, which is
# what makes rotating a bucket or a credential a restart rather than a rebuild. Set the variables instead.
#
# An unusable value is refused rather than worked around. Selecting a provider name that is not one of the
# three below aborts the content operation instead of quietly falling back to database storage, because a
# deployment that believed it had selected s3 must not write to a different backend on the strength of a
# typo. The entry point applies the same closed vocabulary at start-up.
#
# MAINTENANCE RULE: eleven of the content.store.* declarations below are the anchors that
# docker/docker-entrypoint.sh substitutes to produce config/content.properties, which takes classpath
# precedence over this file's copy in ofbiz.jar. They are the eleven listed in that script's
# CONTENT_STORE_PROPERTIES array, paired index by index with the CONTENT_STORE_VARIABLES that supply
# them; the remaining content.store.* keys here are read only by the providers and are not rendered.
# Each anchor is matched as "^<name>=" at the start of a line, so the name, the "=" and the position at
# column one must be preserved. Renaming one, commenting it out or putting spaces around the "=" makes
# the substitution silently do nothing; the entry point verifies every one of the eleven after
# rendering and refuses to start rather than serve a configuration in which a storage setting was
# quietly dropped. ContentStorePropertiesContractTests asserts the two sides against each other, so a
# key added to or removed from either one fails the build rather than a deployment.

# selects the storage backend for DataResource content and uploads   <- OFBIZ_CONTENT_STORE_PROVIDER
# database (the default) means the existing DataResource database storage
# filesystem means the content.upload.path.prefix location above; s3 means the content.store.s3.* keys below
content.store.provider=database

# hard ceiling, in bytes, on the whole-content convenience operations of the storage providers
# (ContentStore.put(String, byte[]) and ContentStore.get(String)); larger content must be moved
# with the streaming operations instead so that a single request cannot exhaust the heap
# accepted range 4096 (4 KiB) .. 536870912 (512 MiB); out-of-range or unparseable values fall back to this default
content.store.max.memory.bytes=20971520

# filesystem provider

# additional absolute directories, comma separated, that the filesystem provider may resolve into
# beyond ofbiz.home itself; blank (the default) confines every key to ofbiz.home
content.store.filesystem.allowed.roots=
# ceiling on the number of upload sub-directories the filesystem provider inspects when it selects
# the current upload directory, so that a very large upload tree cannot make directory selection unbounded
# accepted range 1 .. 1000000; out-of-range or unparseable values fall back to this default
content.store.filesystem.max.upload.directories=5000

# s3 provider

# target bucket; required by the s3 provider                         <- OFBIZ_S3_BUCKET
content.store.s3.bucket=
# region identifier; required by the s3 provider                     <- OFBIZ_S3_REGION
content.store.s3.region=
# endpoint override url; blank means Amazon S3, otherwise any S3-compatible store (MinIO, Ceph, ...)
# <- OFBIZ_S3_ENDPOINT; https is required unless content.store.s3.allow.plaintext.endpoint is true, the
# host has to appear in content.store.s3.endpoint.allowlist below, and a cloud instance metadata address
# is refused in every configuration - the provider sends this deployment's credentials to whatever it is
# told is the object store, so that address would hand out the instance's own role credentials
content.store.s3.endpoint=
# hosts an endpoint override may name; comma separated                <- OFBIZ_S3_ENDPOINT_ALLOWLIST
# required whenever content.store.s3.endpoint is set: naming the host a second time is what turns
# "whatever that property happens to hold" into "one of the hosts this deployment declared"
content.store.s3.endpoint.allowlist=
# permit a plaintext http endpoint; true|false, default false   <- OFBIZ_S3_ALLOW_PLAINTEXT_ENDPOINT
# for a local development store only; true sends content and signed requests over an unencrypted network
content.store.s3.allow.plaintext.endpoint=false
# which identity the provider authenticates as; static|default-chain <- OFBIZ_S3_CREDENTIALS_PROVIDER
# blank here, and required by the s3 provider, because it is never inferred from whether a credential
# happens to be present: static requires BOTH credential properties below, default-chain requires
# NEITHER and defers to the AWS default credential chain (instance role, container credentials, shared
# profile, environment). Inferring it would mean a mistyped property name or a secret whose injection
# failed silently changed which identity the deployment ran as.
content.store.s3.credentials.provider=
# object store credentials; both are blank here so that no credential is committed
# <- OFBIZ_S3_ACCESS_KEY_ID and OFBIZ_S3_SECRET_ACCESS_KEY. Used only with
# content.store.s3.credentials.provider=static, which requires both of them; a contradiction in either
# direction is refused by the provider and by the entry point rather than resolved by guessing.
content.store.s3.access.key.id=
content.store.s3.secret.access.key=
# path-style addressing; true|false, default false                   <- OFBIZ_S3_PATH_STYLE
# usually true for S3-compatible stores that do not support virtual-host-style addressing
content.store.s3.path.style=false

# ceiling on a whole-content read, in bytes, for every provider that materialises content in the heap
#
# Deliberately not environment-driven: this is an operational tuning knob rather than a security control
# or a secret, so it is set here or through the SystemProperty entity like every other sizing property.
# A single stored object larger than this is refused by get() instead of being read, because one
# oversized object is otherwise enough to exhaust the heap of whichever instance served the request.
# Content that is legitimately larger is read through openStream(), which streams and is not capped.
# A value that is absent, unparsable or not positive falls back to this same 32 MiB.
content.store.max.get.bytes=33554432
# key prefix the s3 provider reports as the upload location; keys are stored relative to it
content.store.s3.key.prefix=content/uploads
# connection establishment deadline in milliseconds; accepted range 100 .. 600000
content.store.s3.connect.timeout.millis=5000
# socket read and write deadline in milliseconds; accepted range 100 .. 600000
content.store.s3.read.timeout.millis=30000
# overall deadline for one store call including every retry, in milliseconds; accepted range 100 .. 600000
content.store.s3.call.timeout.millis=60000
# deadline for one individual attempt of a store call, in milliseconds; accepted range 100 .. 600000
content.store.s3.call.attempt.timeout.millis=20000
# total attempts, first try included, before a store call is abandoned; accepted range 1 .. 10
content.store.s3.max.attempts=3
# consecutive failures that open the provider breaker and shed further calls; accepted range 1 .. 1000
content.store.s3.breaker.failure.threshold=5
# time the provider breaker stays open before a single probe call is admitted, in milliseconds
# accepted range 100 .. 3600000
content.store.s3.breaker.reset.millis=30000
