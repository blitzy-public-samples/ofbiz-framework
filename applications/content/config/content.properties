owner.content.id=CONTENT_ROOT
img.request=/content/control/img/
img.request.param.name=imgId

stream.permission.service=genericContentPermission
stream.buffersize=8192

baseUrl=https://localhost:8443
disable.ftl.template.cache=true
permissionRecorderOn=true
allowedHasRoleOperations=HAS_USER_ROLE|HAS_AUTHOR_ROLE|HAS_EDITOR_ROLE|HAS_ADMIN_ROLE|HAS_PUBLISHER_ROLE
viewSize=10

# user level content uploading (relative to ofbiz.home)
content.upload.path.prefix=runtime/uploads
content.upload.max.files=250
content.upload.always.local.file=true

# content output folder (relative to ofbiz.home)
content.output.path=runtime/output

# default mime type used in *ContentWrapper classes
defaultMimeType=text/html; charset=utf-8


# ---------------------------------------------------------------------------------------------------
# Content storage backend
#
# Every value below ships blank, or database/false, so that an unmodified checkout stores content
# exactly where it always has and these committed declarations carry no credential.
# docker/docker-entrypoint.sh renders these seven declarations from the OFBIZ_CONTENT_STORE_PROVIDER
# and OFBIZ_S3_* environment variables into config/content.properties, which precedes ofbiz.jar on the
# class path. Each is substituted by matching "^<name>=" at the start of a line, so the name, the "="
# and the position at column one must be preserved. See DOCKER.adoc.
#
# Which backend holds file-backed DataResource content (LOCAL_FILE, OFBIZ_FILE, CONTEXT_FILE and their
# _BIN variants). ContentStoreFactory reads it; an unrecognised value is logged and treated as database
# rather than refused, so a typo cannot stop an instance from starting.
#   database   - the default. Content is stored the way it always has been and no store is consulted.
#   filesystem - the upload directory named by content.upload.path.prefix above (runtime/uploads out of
#                the box), including its sharding rule. Nothing about where content is written changes;
#                it becomes a fleet-wide store when that one directory is a shared mount (NFS, EFS).
#                Needs no credentials.
#   s3         - an S3-compatible object store, configured by the properties that follow. A file the
#                content-store seam in DataResourceWorker has bound to a transaction is published to the
#                bucket in that transaction's beforeCompletion callback, so a publication failure rolls
#                the transaction back rather than committing a row the fleet cannot read; if the
#                transaction then does not commit, the keys it published are deleted again on a
#                best-effort basis. On the read side, a resolution copies the bucket's object onto the
#                instance before the local file is consulted, and falls back to the local file for an
#                object the bucket does not hold.
content.store.provider=database

# The bucket file-backed content is stored in. Required when the provider is s3.
content.store.s3.bucket=

# The region the SDK signs requests for. Required when the provider is s3; an S3-compatible store that
# does not use regions accepts any value, because the SDK only needs one to sign with.
content.store.s3.region=

# The endpoint to address instead of the AWS one, applied with endpointOverride. Leave blank for Amazon
# S3; set an absolute http or https URI (for example https://minio.example.internal:9000) for MinIO,
# Ceph or any other S3-compatible store.
content.store.s3.endpoint=

# Static credentials for the object store. Configure both or neither: when both are blank the AWS SDK's
# default credential chain is used, which is how an instance picks up an IAM role instead of a key.
content.store.s3.access.key.id=
content.store.s3.secret.access.key=

# Whether to address the bucket as a path segment (https://endpoint/bucket/key) rather than as a
# hostname (https://bucket.endpoint/key). Most non-AWS S3-compatible stores require true.
content.store.s3.path.style=false

# Server-side encryption to request on every object written. The header is sent on the request rather
# than left to the bucket's default, so content is encrypted at rest whether or not the bucket declares
# one - and a bucket policy that REQUIRES the header is satisfied.
#   none    - the default. The object is stored however the bucket's own configuration says; require
#             bucket-side encryption if you leave this unset.
#   sse-s3  - the store encrypts with its own managed key (AES256).
#   sse-kms - the store encrypts with the KMS key named below, which is then required.
# An unrecognised value is REFUSED at start up rather than defaulted, because silently storing content
# unencrypted after being asked to encrypt it is the one outcome this setting exists to prevent.
content.store.s3.encryption=none

# The KMS key id, alias or ARN to encrypt with. Required when content.store.s3.encryption is sse-kms,
# ignored otherwise.
content.store.s3.kms.key.id=
