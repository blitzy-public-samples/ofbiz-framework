owner.content.id=CONTENT_ROOT
img.request=/content/control/img/
img.request.param.name=imgId

stream.permission.service=genericContentPermission
stream.buffersize=8192

baseUrl=https://localhost:8443
disable.ftl.template.cache=true
permissionRecorderOn=true
allowedHasRoleOperations=HAS_USER_ROLE|HAS_AUTHOR_ROLE|HAS_EDITOR_ROLE|HAS_ADMIN_ROLE|HAS_PUBLISHER_ROLE
viewSize=10

# user level content uploading (relative to ofbiz.home)
content.upload.path.prefix=runtime/uploads
content.upload.max.files=250
content.upload.always.local.file=true

# content output folder (relative to ofbiz.home)
content.output.path=runtime/output

# default mime type used in *ContentWrapper classes
defaultMimeType=text/html; charset=utf-8

# content storage backend (see DOCKER.adoc for the matching container environment variables)
# docker/docker-entrypoint.sh writes an environment-substituted copy of this file into /ofbiz/config,
# which precedes the ofbiz.jar copy on the classpath, so the injected runtime value wins.
# these keys are read by org.apache.ofbiz.content.data.store.ContentStoreFactory (resource name "content").
# an empty value self-defaults: UtilProperties returns the caller's default when a value is blank.

# selects where DataResource content and uploads are stored; set from OFBIZ_CONTENT_STORE_PROVIDER
# database (default) = existing DataResource database storage; the S3 code path is never invoked
# filesystem = current content.upload.path.prefix (runtime/uploads) behaviour is preserved;
#              across multiple instances runtime/uploads must be on shared storage
# s3 = activates the S3-compatible provider configured by the content.store.s3.* keys below
content.store.provider=database

# target bucket; required when content.store.provider=s3; set from OFBIZ_S3_BUCKET
content.store.s3.bucket=
# region identifier; required when content.store.provider=s3; set from OFBIZ_S3_REGION
content.store.s3.region=
# endpoint override url; blank = Amazon S3; set to target any S3-compatible store (MinIO, Ceph, ...)
# set from OFBIZ_S3_ENDPOINT
content.store.s3.endpoint=
# object store credentials; set from OFBIZ_S3_ACCESS_KEY_ID and OFBIZ_S3_SECRET_ACCESS_KEY
# both are intentionally blank here: no credential may be committed to the repository or baked into an image
# when BOTH are omitted the AWS default credential provider chain is used
# (instance role, container credentials, shared profile, environment)
content.store.s3.access.key.id=
content.store.s3.secret.access.key=
# true|false, default false; drives the S3 client forcePathStyle setting; set from OFBIZ_S3_PATH_STYLE
# usually true for S3-compatible stores that do not support virtual-host-style addressing
content.store.s3.path.style=false
